name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: redtag
          POSTGRES_USER: redtag
          POSTGRES_PASSWORD: redtag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U redtag -d redtag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://redtag:redtag@localhost:5432/redtag
      AUTH_MODE: dev
      JWT_SECRET: ci-only
      REAL_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check services tests scripts
      - run: mypy services/api/app --ignore-missing-imports
      - run: alembic -c services/api/alembic.ini upgrade head
      - run: PYTHONPATH=services/api python scripts/seed_demo.py
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t redtag-api:ci .
      - run: docker build -f apps/web/Dockerfile -t redtag-web:ci apps/web
