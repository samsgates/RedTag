services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: redtag
      POSTGRES_USER: redtag
      POSTGRES_PASSWORD: redtag
    ports:
      - "5432:5432"
    volumes:
      - redtag_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redtag -d redtag"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: ["bash", "-lc", "alembic -c services/api/alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080"]

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "app.worker_service:app", "--host", "0.0.0.0", "--port", "8080"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      REDTAG_API_URL: http://api:8080/api/v1
      REDTAG_AUTH_MODE: dev
      REDTAG_DEFAULT_TENANT_ID: tenant_demo
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  redtag_pg:
